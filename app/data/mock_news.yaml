# Headlines for the mock market's scripted week.
# days_ago counts trading days back from the last session; hour is UTC.

- symbol: MSFT
  days_ago: 3
  hour: 21
  title: Microsoft signals slower growth in data center spending next year
  summary: >-
    On its investor call the CFO said capital spending growth will 'moderate meaningfully'
    in fiscal 2027 as the company digests AI capacity built over the past two years. Azure
    growth guidance was unchanged.

- symbol: MSFT
  days_ago: 2
  hour: 13
  title: Analysts split on whether Microsoft's capex comments mark a peak in AI spending
  summary: >-
    Some analysts read the remarks as a digestion pause; others warned other hyperscalers
    could follow.

- symbol: NVDA
  days_ago: 2
  hour: 16
  title: Nvidia shares slide as Microsoft's capex comments rattle AI chip stocks
  summary: >-
    Nvidia fell the most among large chipmakers. Microsoft is estimated to be one of its
    largest customers for data center GPUs.

- symbol: NVDA
  days_ago: 1
  hour: 15
  title: Nvidia extends losses; options traders pay up for protection
  summary: >-
    Implied volatility rose as investors weighed whether other cloud customers will slow
    orders.

