name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-24.04-arm with Python 3.11 matches a 64-bit Raspberry Pi on Bookworm.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-24.04-arm
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
